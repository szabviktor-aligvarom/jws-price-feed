name: Heti ar- es keszletfeed

on:
  schedule:
    # Hetfo 05:30 UTC = 07:30 budapesti nyari ido (CEST).
    # Telen (CET) ez 06:30 budapesti idot jelent.
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo letoltese
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feed generalasa
        id: build
        env:
          FEED_WORKERS: "8"
        run: python scripts/build_feed.py

      # Ha a fenti lepes elbukott (sanity-check), a workflow itt megall,
      # a commit nem tortenik meg, es a linken az utolso jo feed marad kint.
      - name: Commit es push
        run: |
          if [ -z "$(git status --porcelain feed)" ]; then
            echo "Nincs valtozas, nincs commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          COUNT=$(python -c "import json;print(json.load(open('feed/feed.json'))['meta']['product_count'])")
          STOCK=$(python -c "import json;print(json.load(open('feed/feed.json'))['meta']['in_stock_count'])")
          git commit -m "Feed frissites: ${COUNT} termek, ${STOCK} keszleten ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # Ha kozben valaki mast pusholt a repoba, ujraprobaljuk: a feed
          # fajlokat mindig a mostani futas eredmenye nyeri.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push sikeres."
              exit 0
            fi
            echo "Push elutasitva, ujraprobalas ($i/5)..."
            git fetch origin main
            git checkout --ours feed || true
            git rebase -X ours origin/main || git rebase --abort
            sleep $((i * 5))
          done
          echo "A push 5 kiserlet utan sem sikerult."
          python scripts/mark_publish_failed.py || true
          exit 1

      - name: Osszefoglalo
        if: always()
        run: |
          if [ -f feed/last_run.json ]; then
            echo '### Futas eredmenye' >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat feed/last_run.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
